<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETEL AI</title>
<link rel="stylesheet" href="css/etelai-core.css">
<link rel="stylesheet" href="css/customer.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <div id="brand">
      <span id="brand-logo" class="brand-medallion"><img src="icons/icon-192.png" alt="Etel AI"></span>
      <span id="brand-name">ETEL AI</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div id="member-chip"></div>
      <button id="theme-toggle-btn" class="theme-toggle-btn" onclick="etelaiToggleTheme()">☀️ Light</button>
    </div>
  </header>

  <main id="chat-window"></main>

  <footer id="composer">
    <input id="msg-input" type="text" placeholder="Ask ETEL AI… / ኢቴል AI ይጠይቁ…" autocomplete="off">
    <button id="send-btn" class="btn btn-primary">➤</button>
  </footer>
</div>

<script src="js/core.js"></script>
<script src="js/customer-chat.js"></script>
</body>
</html>
