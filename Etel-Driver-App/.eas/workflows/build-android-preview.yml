name: Android preview APK

# MANUAL ONLY (decided with the owner to save the free build time): this no longer runs on every merge. The app code still goes to phones
# over the air on every merge (publish-update.yml, which does not use build time). Build a new APK only when the Android native code
# changed or at the end of the planned phases: Expo website > Workflows > Run workflow > Android preview APK.
# (No `on:` trigger = it never starts by itself. To build automatically again, add the old `on: push` block back.)

jobs:
  build_android:
    name: Build Android APK (preview)
    type: build
    params:
      platform: android
      profile: preview
