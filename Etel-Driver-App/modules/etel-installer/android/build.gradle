plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.etelgroup.installer'
version = '1.0.0'

android {
  namespace "expo.modules.etelInstaller"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.core:core:1.13.1"
}
