name: Delivery CI

# Runs on every pull request and every push to main. A red check here means
# the change would have broken something the tests cover - fix before merging.
on:
  pull_request:
    paths: ['delivery/**', 'EtelId/**', 'EtelERP/**', 'EtelERP-Frappe/**', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['delivery/**', 'EtelId/**', 'EtelERP/**', 'EtelERP-Frappe/**', '.github/workflows/ci.yml']

jobs:
  etelid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'gd, exif' }
      - name: PHP syntax (EtelID plugin)
        run: find EtelId -name '*.php' -print0 | xargs -0 -n1 -P4 php -l >/dev/null
      - name: Security unit tests
        run: php EtelId/tests/security_unit.php
      - name: Fayda ID photo storage tests
        run: php EtelId/tests/fayda_files_unit.php
      - name: Profile photo shrinker tests
        run: php EtelId/tests/photos_unit.php

  etelerp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Python syntax (EtelERP app)
        run: python -m compileall -q EtelERP-Frappe/etel_erp
      - name: EtelERP unit tests
        run: python -I -m unittest discover -s EtelERP-Frappe/tests -v
      - name: Login script syntax
        run: node --check EtelERP-Frappe/etel_erp/public/js/etel_login.js

  etelerp-php:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: etelerp_test
          MARIADB_USER: etelerp
          MARIADB_PASSWORD: testpass
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_NAME: etelerp_test
      TEST_DB_USER: etelerp
      TEST_DB_PASS: testpass
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'pdo_mysql' }
      - name: PHP syntax (EtelERP)
        run: find EtelERP -name '*.php' -print0 | xargs -0 -n1 -P4 php -l >/dev/null
      - name: Browser script syntax (EtelERP)
        run: for f in EtelERP/assets/js/*.js EtelERP/sw.js; do node --check "$f"; done
      - name: EtelERP tests (real database)
        run: php EtelERP/tests/run.php
      - name: EtelERP concurrency tests (parallel processes)
        run: php EtelERP/tests/concurrency.php

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - name: PHP syntax
        run: |
          find delivery -name '*.php' -not -path '*/backup*' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l >/dev/null
      - name: JavaScript syntax
        run: |
          find delivery -name '*.js' -not -path '*/releases/*' -not -path '*/backup*' \
            -not -name '*.min.js' -print0 | xargs -0 -n1 node --check
      - name: Migration numbering and XSS ratchet
        run: |
          python3 delivery/tests/ci/check_migrations.py
          python3 delivery/tests/ci/check_xss_sinks.py
          python3 delivery/tests/ci/check_no_fake_stats.py
          python3 delivery/tests/ci/check_a11y_wiring.py
          python3 delivery/tests/ci/check_rate_card.py
          python3 delivery/tests/ci/check_track_eta.py
          python3 delivery/tests/ci/check_shop_hours.py
          python3 delivery/tests/ci/check_speed_pass.py
          node delivery/tests/photo_match_test.js
      # check_reserved_columns.py needs the built database, so it runs in the
      # integration job (via run_integration.sh).

  integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root_pw
          MARIADB_DATABASE: etel_delivery
          MARIADB_USER: etel
          MARIADB_PASSWORD: etel_test_pw
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_PWD: root_pw
      MYSQL_ADMIN_ARGS: -h127.0.0.1 -uroot
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, mbstring, gd, exif
      - name: Test configuration (throwaway values, never real secrets)
        run: |
          mysql $MYSQL_ADMIN_ARGS -e "GRANT ALL ON *.* TO 'etel'@'%'; FLUSH PRIVILEGES;"
          cat > delivery/api/.env <<ENV
          DB_HOST=127.0.0.1
          DB_NAME=etel_delivery
          DB_USER=etel
          DB_PASS=etel_test_pw
          TOKEN_SECRET=ci_token_secret_not_real_0123456789abcdef
          ETEL_OS_KEY=ci_os_key
          APP_ENV=development
          CRON_DISPATCH_KEY=test_cron_key
          UPDATER_PASSWORD=ci_updater_pw
          ENV
      - name: Build DB from the repo and run every test
        working-directory: delivery
        env:
          FRESH_DB: '1'
          ETEL_TEST_DB_NAME: etel_delivery
        run: |
          # root creates/drops the schema; tests connect as 'etel' from api/.env
          ./tests/ci/run_integration.sh
