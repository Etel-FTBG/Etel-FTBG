; ETEL Madeya - PHP settings for hosts that run PHP through FPM or CGI (read by PHP itself, about every 5 minutes).
; The same settings for Apache's mod_php are in .htaccess. Keep both in step.
upload_max_filesize = 10M
post_max_size = 10M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1
; Never show PHP errors to visitors on the live site; they go to the error log.
display_errors = Off
log_errors = On
error_reporting = E_ALL
