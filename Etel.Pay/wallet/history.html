<style>
.hist-wrap{padding:16px 20px 28px}

/* ── Summary cards ─────────────────────────────────────────── */
.hist-summary{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px;
}
.hs-card{
  position:relative; overflow:hidden;
  background:linear-gradient(155deg,var(--bg-3) 0%,var(--bg-2) 100%);
  border:1px solid var(--gold-brd); border-radius:var(--r-lg);
  padding:16px 16px 15px;
  box-shadow:0 10px 28px rgba(0,0,0,.28);
}
.hs-card::after{
  content:''; position:absolute; top:-30%; right:-20%;
  width:90px; height:90px; border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,.16) 0%,transparent 72%);
  pointer-events:none;
}
.hs-top{display:flex; align-items:center; gap:7px; margin-bottom:9px}
.hs-top svg{width:14px;height:14px}
.hs-label{font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:1.1px}
.hs-val{font-family:var(--fm);font-size:21px;font-weight:700;letter-spacing:-.2px}

/* ── Search icon (SVG, no emoji) ───────────────────────────── */
.ep-search-icon svg{width:15px;height:15px;display:block}

/* ── Filter pills row: allow horizontal scroll without wrapping ── */
.ep-pills.mb-16{flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none; padding-bottom:2px}
.ep-pills.mb-16::-webkit-scrollbar{display:none}
.ep-pills.mb-16 .ep-pill{flex-shrink:0}

/* ── Date separator ────────────────────────────────────────── */
.ep-date-sep{
  padding:14px 2px 6px;font-size:11px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);
}
.ep-date-sep:first-child{padding-top:2px}

/* ── Transaction rows, elevated within this page only ─────── */
.hist-wrap .ep-tx{
  padding:12px 4px; border-radius:var(--r-sm);
  border-bottom:1px solid rgba(212,175,55,.08);
  transition:background .15s;
}
.hist-wrap .ep-tx:last-child{border-bottom:none}
.hist-wrap .ep-tx-dot{
  width:40px; height:40px; font-size:16px;
  border:1px solid; box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.hist-wrap .ep-tx-who{font-size:14.5px}

/* ── Company/service chip ──────────────────────────────────── */
.co-chip{
  display:inline-flex; align-items:center; gap:4px;
  font-family:var(--fm); font-size:10.5px; font-weight:600;
  padding:2px 7px 2px 6px; border-radius:20px;
  border:1px solid; line-height:1.5; white-space:nowrap;
  vertical-align:middle;
}
.co-chip svg{width:10px;height:10px;flex-shrink:0}
.co-chip.co-gebeya{ color:#F0B84A; border-color:rgba(240,184,74,.35); background:rgba(240,184,74,.10); }
.co-chip.co-delivery{ color:#5FB6E8; border-color:rgba(95,182,232,.35); background:rgba(95,182,232,.10); }
.co-chip.co-pay{ color:var(--gold-lt); border-color:var(--gold-brd); background:var(--gold-bg); }
.tx-sub-row{display:flex; align-items:center; gap:6px; min-width:0; margin-top:3px}
.tx-sub-row .ep-tx-sub{margin-top:0; min-width:0}
.ep-tx-meta > .co-chip{margin-top:5px}

/* ── Empty state icon ──────────────────────────────────────── */
.ep-empty-icon svg{width:30px;height:30px;opacity:.55}

/* ── Detail sheet ──────────────────────────────────────────── */
.txd-head{text-align:center;padding:8px 0 22px}
.txd-icon{
  width:56px;height:56px;border-radius:50%;margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid; box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.txd-icon svg{width:24px;height:24px}
.txd-amt{font-family:var(--fm);font-size:27px;font-weight:700;letter-spacing:-.3px}
.txd-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 2px;border-bottom:1px solid var(--gold-brd);gap:16px;
}
.txd-row:last-child{border-bottom:none}
.txd-k{font-size:12.5px;color:var(--text-3);flex-shrink:0}
.txd-v{font-size:13px;font-weight:600;font-family:var(--fm);max-width:210px;text-align:right;word-break:break-all}
.txd-service-note{font-size:11.5px;color:var(--text-3);margin-top:6px;line-height:1.5;text-align:right}

/* Load more */
#load-more-btn{margin-top:16px;display:none}

/* ── Receipt (transaction detail sheet) ──────────────────────
   NOTE: css/etel-design-v4.css (loaded after this block, site-wide)
   carries a blanket rule -- `p, span, div, li, td, th, label {
   color: inherit !important }` -- meant to keep text readable on
   every page's dark/gold background. It cascades a div's color up
   to <body>'s own #F7EFD9 (near-white) !important color, which is
   invisible on this receipt's white card. Every color below is
   !important specifically to survive that rule; nothing else on
   this page needed it because everything else sits on a dark
   background where inheriting that near-white text was already
   the intended look. */
.receipt, .receipt *{
  color:#1a1207 !important;
}
.receipt{
  background:#fff; border-radius:var(--r-lg);
  overflow:hidden; border:1px solid rgba(0,0,0,.08);
  font-family:'Segoe UI',Roboto,Arial,sans-serif;
}
.rcpt-band, .rcpt-band *{
  color:#fff !important;
}
.rcpt-band{
  background:linear-gradient(120deg,#7A5518 0%,#C8960C 45%,#D4AF37 75%,#F2CC6B 100%);
  padding:18px 20px 16px; text-align:center;
}
.rcpt-mark{
  width:38px;height:38px;border-radius:50%;margin:0 auto 8px;
  background:rgba(255,255,255,.18); display:flex;align-items:center;justify-content:center;
  font-family:var(--fe); font-weight:700; font-size:17px;
}
.rcpt-org{font-family:var(--fd);font-weight:800;font-size:15px;letter-spacing:.3px}
.rcpt-sub{font-size:11.5px;opacity:.9;margin-top:2px}
.rcpt-status{
  display:inline-block;margin-top:10px;padding:3px 12px;border-radius:20px;
  font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  background:rgba(255,255,255,.22);
}
.rcpt-body{padding:18px 18px 6px}
.rcpt-amt-row{text-align:center;padding-bottom:16px;border-bottom:1px dashed rgba(0,0,0,.15);margin-bottom:14px}
.rcpt-amt{font-family:var(--fm);font-size:26px;font-weight:700}
.rcpt-amt-dir, .rcpt-sec-title,
.rcpt-field b, .rcpt-table td:first-child,
.rcpt-words b, .rcpt-qr-cap, .rcpt-foot{
  color:#7a6540 !important;
}
.rcpt-amt-dir{font-size:11.5px;margin-top:2px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.rcpt-sec-title{
  font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  margin:14px 0 8px;
}
.rcpt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:4px}
.rcpt-field{font-size:12px;line-height:1.65}
.rcpt-field b{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.rcpt-table{width:100%;border-collapse:collapse;margin-top:2px}
.rcpt-table tr{border-bottom:1px solid rgba(0,0,0,.08)}
.rcpt-table tr:last-child{border-bottom:none}
.rcpt-table td{padding:8px 2px;font-size:12.5px;vertical-align:top}
.rcpt-table td:first-child{width:46%}
.rcpt-table td:last-child{font-weight:600;text-align:right;font-family:var(--fm);word-break:break-word}
.rcpt-words{
  margin:14px 0 4px;padding:10px 12px;border-radius:9px;
  background:#FBF6E7;border:1px solid #EEDDA8;font-size:11.5px;text-align:center;
}
.rcpt-words b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;font-weight:700}
.rcpt-qr-wrap{text-align:center;padding:16px 0 6px}
.rcpt-qr-box{display:inline-block;padding:8px;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:8px}
.rcpt-qr-cap{font-size:10px;margin-top:6px;letter-spacing:.3px}
.rcpt-foot{
  text-align:center;padding:14px 18px 18px;font-size:10px;
  border-top:1px solid rgba(0,0,0,.08);margin-top:8px;line-height:1.6;
}
.receipt .co-chip.co-gebeya{ color:#B8790A !important; }
.receipt .co-chip.co-delivery{ color:#1E6FA8 !important; }
.receipt .co-chip.co-pay{ color:#8A6A10 !important; }
.rcpt-actions{display:flex;gap:10px;margin-top:14px}
.rcpt-actions .ep-btn{flex:1}

@media print{
  body > *:not(#sheet-tx){display:none!important}
  #sheet-tx{
    position:static!important;background:#fff!important;display:block!important;
    inset:auto!important;
  }
  #sheet-tx .ep-sheet{
    box-shadow:none!important;max-width:none!important;width:100%!important;
    margin:0!important;border-radius:0!important;padding:0!important;
  }
  #sheet-tx .ep-sheet-handle,#sheet-tx .ep-sheet-title,.rcpt-actions,#ep-toast{display:none!important}
  .receipt{border:none;border-radius:0}
}

<script>
let _allTx    = [];
let _filter   = 'all';
let _page     = 0;
let _hasMore  = false;

/* ── Cross-company linkage ──────────────────────────────────────
   EtelPay is the shared wallet behind every Etel Group app. Some
   transactions are pure wallet-to-wallet moves (send/receive/NFC
   tap-to-pay), but others are settled on EtelPay's behalf by a
   sibling company through its own server-to-server bridge:
     - EtelGebeya's escrow release/refund (partner: gebeya/etelgebeya)
     - Delivery & Ride driver payouts / cashouts (partner: delivery)
   The API now returns which partner (if any) settled each transaction;
   older rows that predate that field fall back to a note-text match. */
const PARTNER_INFO = {
  gebeya:     { cls:'co-gebeya',   label:'Etel Gebeya',
    svg:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
    note:"Settled through Etel Gebeya's marketplace escrow." },
  etelgebeya: { cls:'co-gebeya',   label:'Etel Gebeya',
    svg:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
    note:"Settled through Etel Gebeya's marketplace escrow." },
  delivery:   { cls:'co-delivery', label:'Delivery & Ride',
    svg:'<rect x="1" y="7" width="14" height="10" rx="1.5"/><path d="M15 10h4l3 3.5V17h-2"/><circle cx="6" cy="18.5" r="1.6"/><circle cx="17" cy="18.5" r="1.6"/>',
    note:'Settled by the Etel Delivery & Ride driver-payout bridge.' }
};
const PARTNER_DEFAULT = { cls:'co-pay', label:'EtelPay',
  svg:'<rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/>',
  note:'Direct EtelPay wallet transfer — no other company involved.' };

function partnerInfo(tx){
  const key = (tx.partner||'').toLowerCase().trim();
  if (key && PARTNER_INFO[key]) return PARTNER_INFO[key];
  // Fallback for rows recorded before the API returned `partner`:
  // infer from the free-text note the settling side wrote.
  const note = (tx.note||'').toLowerCase();
  if (/gebeya/.test(note)) return PARTNER_INFO.gebeya;
  if (/delivery|\bride\b/.test(note)) return PARTNER_INFO.delivery;
  return PARTNER_DEFAULT;
}
function companyChip(tx){
  const p = partnerInfo(tx);
  return `<span class="co-chip ${p.cls}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${p.svg}</svg>${EP_CORE.esc(p.label)}</span>`;
}

EP_CORE.onReady(async function(){
  EP_CORE.initSheets();
  if(!EP_CORE.requireAuth()) return;
  await loadHistory();
});

async function loadHistory(){
  _page=0; _allTx=[];
  document.getElementById('tx-list').innerHTML='<div class="ep-empty"><div class="ep-dots"><span></span><span></span><span></span></div></div>';
  try{
    const j = await EP_API.getHistory(30,0);
    if(j.success){
      _allTx = j.data.transactions||j.data||[];
      _hasMore = _allTx.length===30;
      calcSummary(_allTx);
      renderTx();
      document.getElementById('load-more-btn').style.display = _hasMore?'flex':'none';
    }
  }catch(e){
    document.getElementById('tx-list').innerHTML='<div class="ep-empty">Failed to load. Pull to retry.</div>';
  }
}

async function loadMore(){
  _page++;
  try{
    const j = await EP_API.getHistory(30,_page*30);
    if(j.success){
      const more = j.data.transactions||j.data||[];
      _allTx = _allTx.concat(more);
      _hasMore = more.length===30;
      calcSummary(_allTx);
      renderTx();
      document.getElementById('load-more-btn').style.display = _hasMore?'flex':'none';
    }
  }catch(e){}
}

function calcSummary(txs){
  let totalIn=0, totalOut=0;
  txs.forEach(tx=>{
    // Only count settled money toward these totals. A still-pending escrow
    // hold isn't a completed movement yet, and a reversed one was undone -
    // counting either here overstates real lifetime in/out, since a
    // cancelled order's original debit would otherwise stay counted
    // forever with no offsetting credit once it's refunded.
    if(tx.status && tx.status!=='completed') return;
    const dir = EP_CORE.txDirection(tx);
    if(dir==='in')  totalIn  += parseFloat(tx.amount)||0;
    else            totalOut += parseFloat(tx.amount)||0;
  });
  document.getElementById('sum-in').textContent  = '+'+EP_CORE.numFmt(totalIn);
  document.getElementById('sum-out').textContent = '-'+EP_CORE.numFmt(totalOut);
}

function setFilter(f){
  _filter = f;
  document.querySelectorAll('.ep-pill').forEach(p=>{
    p.classList.toggle('active', p.dataset.filter===f);
  });
  renderTx();
}

let _searchQ='';
function onSearch(){
  _searchQ = document.getElementById('search-inp').value.toLowerCase();
  renderTx();
}

function filtered(){
  return _allTx.filter(tx=>{
    const matchFilter = _filter==='all' || tx.type===_filter || (_filter==='pending'&&tx.status==='pending');
    if(!matchFilter) return false;
    if(!_searchQ) return true;
    const hay = [(tx.sender_phone||''),(tx.receiver_phone||''),(tx.note||''),(tx.ref||'')].join(' ').toLowerCase();
    return hay.includes(_searchQ);
  });
}

function renderTx(){
  const txs = filtered();
  const c = document.getElementById('tx-list');
  if(!txs.length){
    c.innerHTML='<div class="ep-empty"><div class="ep-empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>'+EP_CORE.t('no_tx')+'</div>';
    return;
  }

  // Group by date
  const groups={};
  txs.forEach(tx=>{
    const d=tx.created_at?new Date(tx.created_at).toDateString():'Unknown';
    if(!groups[d]) groups[d]=[];
    groups[d].push(tx);
  });

  let html='';
  Object.keys(groups).forEach(date=>{
    const label = date===new Date().toDateString()?'Today':
                  date===new Date(Date.now()-86400000).toDateString()?'Yesterday':date;
    html+=`<div class="ep-date-sep">${label}</div>`;
    groups[date].forEach(tx=>{
      const dir=EP_CORE.txDirection(tx);
      const sign=dir==='in'?'+':'-';
      const status=tx.status&&tx.status!=='completed'?`<span class="ep-badge ep-badge-warn" style="margin-left:auto">${tx.status}</span>`:'';
      html+=`<div class="ep-tx" onclick="showDetail(${JSON.stringify(tx).replace(/"/g,'&quot;')})">
        <div class="ep-tx-dot ${dir}">${EP_CORE.txIcon(tx)}</div>
        <div class="ep-tx-meta">
          <div class="ep-tx-who">${EP_CORE.esc(EP_CORE.txLabel(tx))}</div>
          <div class="tx-sub-row">
            <div class="ep-tx-sub">${EP_CORE.esc(tx.note||tx.type||'')}</div>
            ${status}
          </div>
          ${companyChip(tx)}
        </div>
        <div class="ep-tx-right">
          <div class="ep-tx-amt ${dir}">${sign}${EP_CORE.numFmt(tx.amount||0)} ${tx.currency||'ETB'}</div>
          <div class="ep-tx-date">${EP_CORE.dateFmt(tx.created_at)}</div>
        </div>
      </div>`;
    });
  });
  c.innerHTML=html;
}

/* ── Amount in words (English, ETB) ─────────────────────────── */
const NUM_ONES = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine',
  'Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const NUM_TENS = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function threeDigitsToWords(n){
  let s='';
  if(n>=100){ s+=NUM_ONES[Math.floor(n/100)]+' Hundred'; n%=100; if(n) s+=' '; }
  if(n>=20){ s+=NUM_TENS[Math.floor(n/10)]; if(n%10) s+='-'+NUM_ONES[n%10]; }
  else if(n>0){ s+=NUM_ONES[n]; }
  return s;
}
function integerToWords(n){
  if(n===0) return 'Zero';
  const groups=[['',1],[' Thousand',1e3],[' Million',1e6],[' Billion',1e9]];
  let parts=[];
  for(let i=groups.length-1;i>=0;i--){
    const size=groups[i][1];
    const chunk=Math.floor(n/size)%1000;
    if(chunk>0) parts.push(threeDigitsToWords(chunk)+groups[i][0]);
  }
  return parts.join(' ');
}
function amountToWords(amount, currency){
  const n = Math.round((parseFloat(amount)||0)*100)/100;
  const whole = Math.floor(n);
  const cents = Math.round((n-whole)*100);
  let words = integerToWords(whole)+' '+(currency||'ETB');
  if(cents>0) words += ' and '+integerToWords(cents)+' Cents';
  return words;
}

}
function txReference(tx){
  return tx.tx_ref || tx.ref || tx.id || '—';
}

  return `

        <tr><td>Payer</td><td>${EP_CORE.esc(tx.sender_phone||(dir==='out'?me:'—'))}</td></tr>
        <tr><td>Receiver</td><td>${EP_CORE.esc(tx.receiver_phone||(dir==='in'?me:'—'))}</td></tr>

function showDetail(tx){
  _rcptTx = tx;
  document.getElementById('tx-detail-body').innerHTML = buildReceiptHtml(tx);
  const qrBox = document.getElementById('rcpt-qr');
  if(qrBox && typeof QRCode!=='undefined'){
    qrBox.innerHTML='';
    new QRCode(qrBox, {
      text: `ETELPAY-RECEIPT|${txReference(tx)}|${tx.amount||0}|${tx.currency||'ETB'}|${tx.created_at||''}`,
      width: 96, height: 96,
      correctLevel: QRCode.CorrectLevel.M
    });
  }
  EP_CORE.openSheet('sheet-tx');
}

function printReceipt(){
  window.print();
}

async function downloadReceiptPdf(){
  const tx = _rcptTx;
  if(!tx || typeof window.jspdf==='undefined'){ printReceipt(); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pw = doc.internal.pageSize.getWidth();
  const marginX = 40;
  let y = 0;

  // Header band
  doc.setFillColor(200,150,12);
  doc.rect(0,0,pw,90,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.text('ETEL GROUP', pw/2, 40, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text("EtelPay - Wallet Transaction Receipt", pw/2, 60, {align:'center'});
  doc.setFontSize(10);
  doc.text(receiptStatus(tx), pw/2, 78, {align:'center'});

  y = 120;
  doc.setTextColor(26,18,7);
  const dir = EP_CORE.txDirection(tx);
  const sign = dir==='in'?'+':'-';
  doc.setFont('helvetica','bold'); doc.setFontSize(20);
  doc.text(`${sign}${EP_CORE.numFmt(tx.amount||0)} ${tx.currency||'ETB'}`, pw/2, y, {align:'center'});
  y += 18;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.setTextColor(122,106,69);
  doc.text(dir==='in'?'MONEY RECEIVED':'MONEY SENT', pw/2, y, {align:'center'});
  doc.setTextColor(26,18,7);
  y += 30;

  function section(title){
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.setTextColor(154,131,82);
    doc.text(title.toUpperCase(), marginX, y);
    doc.setTextColor(26,18,7);
    y += 16;
  }
  function field(label, value){
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.setTextColor(122,106,69);
    doc.text(String(label), marginX, y);
    doc.setTextColor(26,18,7);
    doc.setFont('helvetica','bold');
    doc.text(String(value), pw-marginX, y, {align:'right'});
    y += 18;
  }

  const me = EP_CORE.getPhone() || '—';
  section('Company Information');
  field('Company', 'Etel Group');
  field('Service', 'EtelPay Digital Wallet');
  field('Country / City', 'Ethiopia, Hawassa');
  field('Website', 'ethelmarket.com');
  y += 6;

  section('Customer Information');
  field('Your Phone', me);
  field('Linked Service', partnerInfo(tx).label);
  y += 6;

  section('Payment / Transaction Information');
  field('Payer', tx.sender_phone || (dir==='out'?me:'—'));
  field('Receiver', tx.receiver_phone || (dir==='in'?me:'—'));
  field('Payment Type', tx.type||'—');
  field('Payment Date & Time', EP_CORE.dateFmtFull(tx.created_at));
  field('Reference No.', String(txReference(tx)));
  field('Note / Reason', tx.note||'—');
  field('Transferred Amount', `${EP_CORE.numFmt(tx.amount||0)} ${tx.currency||'ETB'}`);
  y += 10;

  doc.setDrawColor(238,221,168);
  doc.setFillColor(251,246,231);
  doc.roundedRect(marginX, y, pw-marginX*2, 40, 6, 6, 'FD');
  doc.setFont('helvetica','bold'); doc.setFontSize(8);
  doc.setTextColor(154,131,82);
  doc.text('AMOUNT IN WORDS', marginX+12, y+15);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.setTextColor(26,18,7);
  doc.text(amountToWords(tx.amount, tx.currency), marginX+12, y+30, {maxWidth: pw-marginX*2-24});
  y += 60;

  // QR code, reusing the on-screen canvas rendered by qrcode.js
  try {
    const qrCanvas = document.querySelector('#rcpt-qr canvas');
    if(qrCanvas){
      const qrData = qrCanvas.toDataURL('image/png');
      doc.addImage(qrData, 'PNG', pw/2-40, y, 80, 80);
      y += 90;
    }
  } catch(e) {}

  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.setTextColor(154,131,82);
  doc.text("EtelPay - Etel Group's trusted digital wallet - ethelmarket.com", pw/2, y+10, {align:'center'});
  doc.text('This is a system-generated receipt and requires no signature.', pw/2, y+22, {align:'center'});

  doc.save(`EtelPay-Receipt-${txReference(tx)}.pdf`);
}
