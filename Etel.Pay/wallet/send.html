<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D4A843">
<title>ኢE Pay — Send</title>
<link rel="manifest" href="manifest.php">
<link rel="stylesheet" href="css/pay.css">
<style>
.send-wrap{padding:20px}
/* Amount display */
.amt-display{
  text-align:center;padding:32px 20px 24px;
  border-bottom:1px solid var(--gold-brd);margin-bottom:24px;
}
.amt-display .ep-bal-amount{font-size:52px;display:block;min-height:64px;word-break:break-all}
.amt-cur{font-size:16px;font-weight:600;color:var(--text-2);margin-top:4px}
/* Recipient card */
.recipient-card{
  display:flex;align-items:center;gap:14px;
  padding:16px;border-radius:var(--r-lg);
  background:var(--glass);border:1px solid var(--gold-brd);
  margin-bottom:20px;
}
.recipient-card.confirmed{border-color:var(--gold-brd-b);background:rgba(212,168,67,.06)}
.r-avatar{width:44px;height:44px;border-radius:50%;background:var(--glass-b);border:1px solid var(--gold-brd-b);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.r-name{font-size:15px;font-weight:600}
.r-phone{font-size:12px;color:var(--text-3);margin-top:2px;font-family:var(--fm)}
/* Numpad */
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 -4px 20px}
.np-key{
  padding:18px 8px;font-family:var(--fd);font-size:24px;font-weight:500;
  background:none;border:none;color:var(--text);cursor:pointer;border-radius:var(--r);
  transition:background var(--fast);user-select:none;
}
.np-key:active{background:var(--glass-b)}
.np-key.del{font-size:20px;color:var(--text-2)}
.np-key.zero{font-size:20px}
/* Confirm sheet content */
.confirm-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--gold-brd)}
.confirm-row:last-child{border-bottom:none}
.confirm-label{font-size:13px;color:var(--text-3)}
.confirm-val{font-size:14px;font-weight:600;font-family:var(--fm)}
/* Success screen */
#success-screen{
  position:fixed;inset:0;z-index:200;
  background:var(--bg);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:40px;
}
.success-icon{font-size:72px;animation:popIn .4s var(--ease)}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.success-title{font-family:var(--fd);font-size:24px;font-weight:700;color:var(--ok);text-align:center}
.success-sub{font-size:14px;color:var(--text-2);text-align:center;line-height:1.6}
</style>
    <link rel="stylesheet" href="css/etel-design-v4.css?v=4.1">
</head>
<body>
<div id="app">

  <!-- Header -->
  <div class="ep-header safe-top">
    <button class="ep-header-back" onclick="EP_CORE.back()">←</button>
    <span class="ep-header-title" data-t="send">Send money</span>
    <div style="width:36px"></div>
  </div>

  <div class="ep-body">
    <div class="send-wrap">

      <!-- Recipient lookup -->
      <div id="step-recipient">
        <div class="ep-section" style="margin-bottom:14px">
          <span class="ep-section-title">Recipient</span>
        </div>
        <div class="ep-field">
          <label class="ep-label" data-t="phone" for="s-phone">Phone number</label>
          <div class="ep-input-wrap">
            <span class="ep-input-icon">📞</span>
            <input class="ep-input" id="s-phone" type="tel" placeholder="0911 234 567" inputmode="tel" autocomplete="tel">
            <button class="ep-input-action" id="s-lookup-btn" onclick="lookupRecipient()" title="Lookup">🔍</button>
          </div>
        </div>
        <div id="recipient-card" class="recipient-card" style="display:none">
          <div class="r-avatar">👤</div>
          <div>
            <div class="r-name" id="r-name">—</div>
            <div class="r-phone" id="r-phone">—</div>
          </div>
          <span class="ep-badge ep-badge-ok" style="margin-left:auto">✓</span>
        </div>
        <div class="ep-err-msg" id="s-lookup-err"></div>
      </div>

      <!-- Amount display -->
      <div class="amt-display">
        <span class="ep-bal-amount" id="amt-display">0</span>
        <div class="amt-cur">ETB</div>
      </div>

      <!-- Note field -->
      <div class="ep-field">
        <label class="ep-label" data-t="note" for="s-note">Note (optional)</label>
        <input class="ep-input" id="s-note" type="text" placeholder="Rent, coffee, lunch…" maxlength="100">
      </div>

      <!-- Numpad -->
      <div class="numpad">
        <button class="np-key" onclick="numpad('1')">1</button>
        <button class="np-key" onclick="numpad('2')">2</button>
        <button class="np-key" onclick="numpad('3')">3</button>
        <button class="np-key" onclick="numpad('4')">4</button>
        <button class="np-key" onclick="numpad('5')">5</button>
        <button class="np-key" onclick="numpad('6')">6</button>
        <button class="np-key" onclick="numpad('7')">7</button>
        <button class="np-key" onclick="numpad('8')">8</button>
        <button class="np-key" onclick="numpad('9')">9</button>
        <button class="np-key" onclick="numpad('.')">.</button>
        <button class="np-key zero" onclick="numpad('0')">0</button>
        <button class="np-key del" onclick="numpad('del')">⌫</button>
      </div>

      <div class="ep-err-msg" id="s-err"></div>
      <button class="ep-btn ep-btn-primary" id="s-btn" onclick="openConfirm()" data-t="send_btn">Send money</button>

    </div>
  </div>

</div><!-- /app -->

<!-- Confirm sheet -->
<div id="sheet-confirm" class="ep-overlay">
  <div class="ep-sheet">
    <div class="ep-sheet-handle"></div>
    <div class="ep-sheet-title" data-t="confirm">Confirm transfer</div>
    <div id="confirm-details">
      <div class="confirm-row"><span class="confirm-label">To</span>     <span class="confirm-val" id="c-to">—</span></div>
      <div class="confirm-row"><span class="confirm-label">Amount</span> <span class="confirm-val text-gold" id="c-amount">—</span></div>
      <div class="confirm-row"><span class="confirm-label">Note</span>   <span class="confirm-val" id="c-note">—</span></div>
      <div class="confirm-row"><span class="confirm-label">Fee</span>    <span class="confirm-val">0.00 ETB</span></div>
    </div>
    <div class="ep-err-msg" id="c-err"></div>
    <button class="ep-btn ep-btn-primary" id="c-btn" onclick="doSend()" style="margin-top:18px" data-t="confirm">Confirm &amp; Send</button>
    <button class="ep-btn ep-btn-ghost" onclick="EP_CORE.closeSheet('sheet-confirm')" style="margin-top:10px" data-t="cancel">Cancel</button>
  </div>
</div>

<!-- Success overlay -->
<div id="success-screen">
  <div class="success-icon">✅</div>
  <div class="success-title">Sent!</div>
  <div class="success-sub" id="success-sub">—</div>
  <button class="ep-btn ep-btn-primary" onclick="EP_CORE.nav('wallet')" style="max-width:280px">Back to wallet</button>
  <button class="ep-btn ep-btn-ghost" onclick="EP_CORE.nav('history')" style="max-width:280px;margin-top:8px">View history</button>
</div>

<div id="ep-toast"></div>

<script src="js/config.js?v=4.1"></script>
<script src="js/api.js?v=4.1"></script>
<script src="js/core.js?v=4.1"></script>
<script>
EP_CORE.onReady(function(){
  EP_CORE.initSheets();
  if(!EP_CORE.requireAuth()) return;
  // Phone from URL param (e.g. linked from history)
  const params = new URLSearchParams(location.search);
  if(params.get('to')){
    document.getElementById('s-phone').value = params.get('to');
    lookupRecipient();
  }
  document.getElementById('s-phone').addEventListener('keydown', e=>{ if(e.key==='Enter') lookupRecipient(); });
});

// ── Numpad ────────────────────────────────────────────────────
let _rawAmt = '';
function numpad(key){
  if(key==='del'){
    _rawAmt = _rawAmt.slice(0,-1);
  } else if(key==='.'){
    if(_rawAmt.includes('.')) return;
    _rawAmt += _rawAmt?'.':'0.';
  } else {
    if(_rawAmt.length>=9) return;  // max 9 digits
    _rawAmt += key;
  }
  document.getElementById('amt-display').textContent = _rawAmt||'0';
}

// ── Recipient lookup ──────────────────────────────────────────
let _recipientConfirmed = false;
async function lookupRecipient(){
  const phone = document.getElementById('s-phone').value.trim();
  const errEl = document.getElementById('s-lookup-err');
  const card  = document.getElementById('recipient-card');
  errEl.textContent='';
  if(!phone){ errEl.textContent='Enter recipient phone.'; return; }

  const btn = document.getElementById('s-lookup-btn');
  const restore = EP_CORE.btnLoading(btn, 'ep-spin-w');
  try{
    // Quick validation: try to send 0 amount to check if phone exists
    // (ETEL Pay doesn't have a dedicated lookup endpoint — we validate on send)
    // Display tentatively confirmed
    document.getElementById('r-name').textContent  = phone;
    document.getElementById('r-phone').textContent = 'ኢE Pay wallet';
    card.style.display='flex';
    _recipientConfirmed = true;
  }finally{ restore(); }
}

// ── Confirm sheet ─────────────────────────────────────────────
function openConfirm(){
  const phone  = document.getElementById('s-phone').value.trim();
  const amount = parseFloat(_rawAmt)||0;
  const note   = document.getElementById('s-note').value.trim();
  const errEl  = document.getElementById('s-err');
  errEl.textContent='';
  if(!phone)         { errEl.textContent='Enter recipient phone.'; return; }
  if(amount<=0)      { errEl.textContent='Enter an amount.'; return; }
  if(amount<1)       { errEl.textContent='Minimum transfer: 1 ETB.'; return; }

  document.getElementById('c-to').textContent     = phone;
  document.getElementById('c-amount').textContent = EP_CORE.numFmt(amount)+' ETB';
  document.getElementById('c-note').textContent   = note||'—';
  EP_CORE.openSheet('sheet-confirm');
}

// ── Send ──────────────────────────────────────────────────────
async function doSend(){
  const phone  = document.getElementById('s-phone').value.trim();
  const amount = parseFloat(_rawAmt)||0;
  const note   = document.getElementById('s-note').value.trim();
  const errEl  = document.getElementById('c-err');
  const btn    = document.getElementById('c-btn');
  errEl.textContent='';

  const restore = EP_CORE.btnLoading(btn,'ep-spin-w');
  try{
    const j = await EP_API.send(phone, amount, 'ETB', note);
    if(j.success){
      EP_CORE.closeSheet('sheet-confirm');
      document.getElementById('success-sub').textContent =
        `ETB ${EP_CORE.numFmt(amount)} sent to ${phone}`;
      document.getElementById('success-screen').style.display='flex';
    } else {
      errEl.textContent = (j.data&&j.data.message)||'Transfer failed.';
      restore();
    }
  }catch(e){
    errEl.textContent='Connection error.';
    restore();
  }
}
</script>
<script src="js/devpanel.js"></script>
<script src="js/desktop-shell.js"></script>
<!-- ETEL AI -- cross-company assistant widget -->

</body>
</html>
