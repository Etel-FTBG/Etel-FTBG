<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D4A843">
<title>ኢE Pay — Profile</title>
<link rel="manifest" href="manifest.php">
<link rel="stylesheet" href="css/pay.css">
<style>
.profile-wrap{padding:20px}
/* Avatar upload */
.avatar-section{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 0 8px}
.av-xl{width:80px;height:80px;border-radius:50%;background:var(--glass-b);border:2px solid var(--gold-brd-b);
  display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;overflow:hidden;position:relative}
.av-xl img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av-edit{position:absolute;bottom:0;right:0;background:var(--gold);border-radius:50%;
  width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px}
.av-name{font-family:var(--fd);font-size:20px;font-weight:600}
.av-phone{font-family:var(--fm);font-size:13px;color:var(--text-3);margin-top:2px}
/* Section label */
.section-label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--text-3);margin:20px 0 10px}
/* App version */
.version-row{text-align:center;padding:20px 0;font-size:12px;color:var(--text-3);font-family:var(--fm)}
</style>
</head>
<body>
<div id="app">

  <div class="ep-header safe-top">
    <button class="ep-header-back" onclick="EP_CORE.nav('wallet')">←</button>
    <span class="ep-header-title" data-t="profile">Profile</span>
    <button class="ep-header-action" id="ep-lang-btn">አማ</button>
  </div>

  <div class="ep-body">
    <div class="profile-wrap">

      <!-- Avatar + name -->
      <div class="avatar-section">
        <div class="av-xl" id="av-btn" onclick="triggerAvatarUpload()">
          <span id="av-icon">👤</span>
          <div class="av-edit">✏️</div>
        </div>
        <div class="av-name" id="p-name">—</div>
        <div class="av-phone" id="p-phone">—</div>
        <div id="p-kyc"></div>
        <input type="file" id="av-file" accept="image/*" style="display:none" onchange="uploadAvatar(event)">
      </div>

      <!-- Profile info rows -->
      <div class="ep-card mb-16">
        <div class="ep-row-item" onclick="openEditName()">
          <div class="ep-row-icon">👤</div>
          <div class="ep-row-text">
            <div class="ep-row-label">Full name</div>
            <div class="ep-row-sub" id="row-name">—</div>
          </div>
          <span class="ep-row-chev">›</span>
        </div>
        <div class="ep-row-item" onclick="openEditEmail()">
          <div class="ep-row-icon">✉️</div>
          <div class="ep-row-text">
            <div class="ep-row-label">Email</div>
            <div class="ep-row-sub" id="row-email">Not set</div>
          </div>
          <span class="ep-row-chev">›</span>
        </div>
        <div class="ep-row-item" style="cursor:default">
          <div class="ep-row-icon">📱</div>
          <div class="ep-row-text">
            <div class="ep-row-label">Phone number</div>
            <div class="ep-row-sub" id="row-phone">—</div>
          </div>
          <span class="ep-badge ep-badge-ok" style="margin-left:auto">Verified</span>
        </div>
      </div>

      <!-- Security -->
      <div class="section-label">Security</div>
      <div class="ep-card mb-16">
        <div class="ep-row-item" onclick="EP_CORE.openSheet('sheet-pin')">
          <div class="ep-row-icon">🔑</div>
          <div class="ep-row-text">
            <div class="ep-row-label" data-t="change_pin">Change PIN</div>
            <div class="ep-row-sub">Update your wallet PIN</div>
          </div>
          <span class="ep-row-chev">›</span>
        </div>
      </div>

      <!-- Preferences -->
      <div class="section-label">Preferences</div>
      <div class="ep-card mb-16">
        <div class="ep-row-item" onclick="toggleLang()">
          <div class="ep-row-icon">🌐</div>
          <div class="ep-row-text">
            <div class="ep-row-label">Language</div>
            <div class="ep-row-sub" id="lang-sub">English</div>
          </div>
          <span class="ep-row-chev">›</span>
        </div>
        <div class="ep-row-item" onclick="EP_CORE.nav('admin')" id="admin-row" style="display:none">
          <div class="ep-row-icon">⚙️</div>
          <div class="ep-row-text">
            <div class="ep-row-label">Admin panel</div>
            <div class="ep-row-sub">Owner control panel</div>
          </div>
          <span class="ep-row-chev">›</span>
        </div>
      </div>

      <!-- Sign out -->
      <button class="ep-btn ep-btn-danger" onclick="doSignOut()" style="margin-bottom:8px">
        Sign out
      </button>

      <div class="version-row">ኢE Pay v1.0.0 · ethelmarket.com</div>

    </div>
  </div>

  <!-- Bottom nav -->
  <nav class="ep-nav">
    <button class="ep-nav-btn" data-page="wallet" onclick="EP_CORE.nav('wallet')">
      <span class="ep-nav-icon">🏠</span><span class="ep-nav-label">Home</span>
    </button>
    <button class="ep-nav-btn" data-page="history" onclick="EP_CORE.nav('history')">
      <span class="ep-nav-icon">📋</span><span class="ep-nav-label">History</span>
    </button>
    <button class="ep-nav-btn" data-page="qr" onclick="EP_CORE.nav('qr')">
      <span class="ep-nav-icon">⬛</span><span class="ep-nav-label">QR</span>
    </button>
    <button class="ep-nav-btn active" data-page="profile">
      <span class="ep-nav-icon">👤</span><span class="ep-nav-label">Profile</span>
    </button>
  </nav>

</div>

<!-- Change PIN sheet -->
<div id="sheet-pin" class="ep-overlay">
  <div class="ep-sheet">
    <div class="ep-sheet-handle"></div>
    <div class="ep-sheet-title" data-t="change_pin">Change PIN</div>
    <div class="ep-field">
      <label class="ep-label" data-t="old_pin">Current PIN</label>
      <input class="ep-input" id="pin-old" type="password" placeholder="••••" maxlength="8" inputmode="numeric">
    </div>
    <div class="ep-field">
      <label class="ep-label" data-t="new_pin">New PIN</label>
      <input class="ep-input" id="pin-new" type="password" placeholder="••••" maxlength="8" inputmode="numeric">
    </div>
    <div class="ep-field">
      <label class="ep-label" data-t="confirm_pin">Confirm new PIN</label>
      <input class="ep-input" id="pin-con" type="password" placeholder="••••" maxlength="8" inputmode="numeric">
    </div>
    <div class="ep-err-msg" id="pin-err"></div>
    <button class="ep-btn ep-btn-primary" id="pin-btn" onclick="doChangePin()" style="margin-top:14px">Update PIN</button>
    <button class="ep-btn ep-btn-ghost" onclick="EP_CORE.closeSheet('sheet-pin')" style="margin-top:10px">Cancel</button>
  </div>
</div>

<!-- Edit name sheet -->
<div id="sheet-name" class="ep-overlay">
  <div class="ep-sheet">
    <div class="ep-sheet-handle"></div>
    <div class="ep-sheet-title">Edit name</div>
    <div class="ep-field">
      <label class="ep-label">Full name</label>
      <input class="ep-input" id="edit-name" type="text" placeholder="Abebe Girma">
    </div>
    <div class="ep-err-msg" id="name-err"></div>
    <button class="ep-btn ep-btn-primary" id="name-btn" onclick="saveName()" style="margin-top:14px">Save</button>
    <button class="ep-btn ep-btn-ghost" onclick="EP_CORE.closeSheet('sheet-name')" style="margin-top:10px">Cancel</button>
  </div>
</div>

<!-- Edit email sheet -->
<div id="sheet-email" class="ep-overlay">
  <div class="ep-sheet">
    <div class="ep-sheet-handle"></div>
    <div class="ep-sheet-title">Edit email</div>
    <div class="ep-field">
      <label class="ep-label">Email</label>
      <input class="ep-input" id="edit-email" type="email" placeholder="you@email.com">
    </div>
    <div class="ep-err-msg" id="email-err"></div>
    <button class="ep-btn ep-btn-primary" id="email-btn" onclick="saveEmail()" style="margin-top:14px">Save</button>
    <button class="ep-btn ep-btn-ghost" onclick="EP_CORE.closeSheet('sheet-email')" style="margin-top:10px">Cancel</button>
  </div>
</div>

<div id="ep-toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/core.js"></script>
<script>
let _profile = {};

EP_CORE.onReady(async function(){
  EP_CORE.initSheets();
  EP_CORE.initLangToggle();
  if(!EP_CORE.requireAuth()) return;
  updateLangSub();
  await loadProfile();
  await showAdminNav();
});

async function showAdminNav(){
  try{var b=await EP_API.getBalance(); if(b.success&&b.data.is_admin){document.getElementById('admin-links').style.display='block';}}catch(e){}
}

async function loadProfile(){
  try{
    const j = await EP_API.getProfile();
    if(!j.success) return;
    _profile = j.data;
    const name  = j.data.full_name||j.data.phone||'—';
    const phone = j.data.phone||EP_CORE.getPhone();
    const email = j.data.email||'';
    const kyc   = j.data.kyc_status||'pending';

    document.getElementById('p-name').textContent      = name;
    document.getElementById('p-phone').textContent     = phone;
    document.getElementById('row-name').textContent    = name;
    document.getElementById('row-phone').textContent   = phone;
    document.getElementById('row-email').textContent   = email||'Not set';
    document.getElementById('p-kyc').innerHTML =
      `<span class="ep-badge ep-badge-${kyc==='verified'?'ok':'warn'}">${kyc}</span>`;

    if(j.data.avatar_url){
      document.getElementById('av-btn').innerHTML=`<img src="${j.data.avatar_url}" alt="avatar"><div class="av-edit">✏️</div>`;
    }
    // Show admin link if admin (heuristic: check if ep_admin_stats responds)
    checkAdmin();
  }catch(e){}
}

async function checkAdmin(){
  try{
    const j=await EP_API.adminStats();
    if(j.success) document.getElementById('admin-row').style.display='flex';
  }catch(e){}
}

// ── Avatar ───────────────────────────────────────────────────
function triggerAvatarUpload(){ document.getElementById('av-file').click(); }
async function uploadAvatar(e){
  const file = e.target.files[0];
  if(!file) return;
  if(file.size>500000){ EP_CORE.toast('Image too large (max 500KB)','err'); return; }
  const reader=new FileReader();
  reader.onload=async function(ev){
    const b64=ev.target.result.split(',')[1];
    try{
      const j=await EP_API.uploadAvatar(b64);
      if(j.success){
        const src='data:'+file.type+';base64,'+b64;
        document.getElementById('av-btn').innerHTML=`<img src="${src}" alt="avatar"><div class="av-edit">✏️</div>`;
        EP_CORE.toast('Avatar updated','ok');
      }else{ EP_CORE.toast((j.data&&j.data.message)||'Upload failed','err'); }
    }catch(err){ EP_CORE.toast('Upload error','err'); }
  };
  reader.readAsDataURL(file);
}

// ── Edit name ────────────────────────────────────────────────
function openEditName(){
  document.getElementById('edit-name').value=_profile.full_name||'';
  EP_CORE.openSheet('sheet-name');
}
async function saveName(){
  const name=document.getElementById('edit-name').value.trim();
  const err=document.getElementById('name-err');
  const btn=document.getElementById('name-btn');
  err.textContent='';
  if(!name){ err.textContent='Name required.'; return; }
  const restore=EP_CORE.btnLoading(btn,'ep-spin-w');
  try{
    const j=await EP_API.updateProfile({full_name:name});
    if(j.success){
      _profile.full_name=name;
      document.getElementById('p-name').textContent=name;
      document.getElementById('row-name').textContent=name;
      EP_CORE.closeSheet('sheet-name');
      EP_CORE.toast('Name updated','ok');
    }else{ err.textContent=(j.data&&j.data.message)||'Update failed.'; }
  }catch(e){ err.textContent='Error.'; }
  restore();
}

// ── Edit email ────────────────────────────────────────────────
function openEditEmail(){
  document.getElementById('edit-email').value=_profile.email||'';
  EP_CORE.openSheet('sheet-email');
}
async function saveEmail(){
  const email=document.getElementById('edit-email').value.trim();
  const err=document.getElementById('email-err');
  const btn=document.getElementById('email-btn');
  err.textContent='';
  const restore=EP_CORE.btnLoading(btn,'ep-spin-w');
  try{
    const j=await EP_API.updateProfile({email});
    if(j.success){
      _profile.email=email;
      document.getElementById('row-email').textContent=email||'Not set';
      EP_CORE.closeSheet('sheet-email');
      EP_CORE.toast('Email updated','ok');
    }else{ err.textContent=(j.data&&j.data.message)||'Update failed.'; }
  }catch(e){ err.textContent='Error.'; }
  restore();
}

// ── Change PIN ────────────────────────────────────────────────
async function doChangePin(){
  const old=document.getElementById('pin-old').value;
  const np=document.getElementById('pin-new').value;
  const cp=document.getElementById('pin-con').value;
  const err=document.getElementById('pin-err');
  const btn=document.getElementById('pin-btn');
  err.textContent='';
  if(!old||!np||!cp){ err.textContent='All fields required.'; return; }
  if(np.length<4){ err.textContent='PIN must be at least 4 digits.'; return; }
  if(np!==cp){ err.textContent='PINs do not match.'; return; }
  const restore=EP_CORE.btnLoading(btn,'ep-spin-w');
  try{
    const j=await EP_API.changePin(old,np,cp);
    if(j.success){
      EP_CORE.closeSheet('sheet-pin');
      EP_CORE.toast('PIN updated. Please sign in again.','ok');
      setTimeout(doSignOut,1500);
    }else{ err.textContent=(j.data&&j.data.message)||'PIN change failed.'; }
  }catch(e){ err.textContent='Error.'; }
  restore();
}

// ── Lang toggle ───────────────────────────────────────────────
function toggleLang(){
  const cur=EP_CORE.getLang();
  EP_CORE.setLang(cur==='am'?'en':'am');
  updateLangSub();
  document.getElementById('ep-lang-btn').textContent=EP_CORE.getLang()==='am'?'EN':'አማ';
}
function updateLangSub(){
  document.getElementById('lang-sub').textContent=EP_CORE.getLang()==='am'?'አማርኛ':'English';
}

// ── Sign out ──────────────────────────────────────────────────
async function doSignOut(){
  try{ await EP_API.logout(); }catch(e){}
  EP_CORE.clearToken();
  EP_CORE.nav('login');
}
</script>
<script src="js/devpanel.js"></script>
<script src="js/desktop.js"></script>
</body>
</html>
