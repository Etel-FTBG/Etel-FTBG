<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D4A843">
<title>ኢE Pay — Offline</title>
<link rel="stylesheet" href="css/pay.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.offline-wrap{text-align:center;padding:40px 32px;max-width:340px}
.offline-icon{font-size:72px;margin-bottom:20px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.offline-title{font-family:var(--fd);font-size:26px;font-weight:700;margin-bottom:8px}
.offline-sub{font-size:14px;color:var(--text-2);line-height:1.6;margin-bottom:28px}
.offline-brand{
  font-family:var(--fe);font-size:36px;font-weight:700;
  background:linear-gradient(135deg,var(--gold-lt),var(--gold),var(--gold-deep));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:6px;
}
.offline-hint{font-size:12px;color:var(--text-3);margin-top:16px;font-family:var(--fm)}
</style>
</head>
<body>
<div class="offline-wrap">
  <div class="offline-brand">ኢE Pay</div>
  <div class="offline-icon">📡</div>
  <div class="offline-title">You're offline</div>
  <div class="offline-sub">
    Check your internet connection and try again.<br>
    <span style="font-family:var(--fe)">ኢንተርኔት ግንኙነትዎን ያረጋግጡ።</span>
  </div>
  <button class="ep-btn ep-btn-primary" onclick="location.reload()" style="max-width:280px;margin:0 auto">Try again</button>
  <div class="offline-hint">ethelmarket.com/Etel.Pay/wallet/</div>
</div>
<script src="js/devpanel.js"></script>
</body>
</html>
