<head>

<style>
/* ════════════════════════════════════════════════════════
   ኢE PAY — Premium Login v5.0
   World: Etel Group carbon+gold medallion (matches ETEL Driver)
   ════════════════════════════════════════════════════════ */

:root {
  color-scheme: dark;
  /* Carbon */
  --c0:#030205; --c1:#0d0d0d; --c2:#0a0703; --c3:#130d05;
  /* Gold ramp */
  --g1:#F2CC6B; --g2:#E8C84A; --g3:#D4AF37; --g4:#C8960C;
  --g5:#A07020; --g6:#7A5518; --g7:#4A3210; --g8:#2A1A06;
  /* Text on dark */
  --cream:#F5EFDD; --tan:#D8C79A; --tan-dim:#B8A576;
  --ff-display:'Syne',sans-serif;
  --ff-body:'Cormorant Garamond',serif;
  --ff-mono:'JetBrains Mono',monospace;
  --ff-am:'Noto Sans Ethiopic',sans-serif;
}

@keyframes holo        { 0%{background-position:0 0}100%{background-position:300% 0} }
@keyframes slide-up    { from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)} }
@keyframes medal-spin  { from{transform:rotate(0)}to{transform:rotate(360deg)} }
@keyframes medal-pulse { 0%,100%{opacity:.9}50%{opacity:1} }
@keyframes shimmer     { 0%{background-position:-400px 0}100%{background-position:400px 0} }
@keyframes glow-drift  { 0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.06)} }
@keyframes spin        { to{transform:rotate(360deg)} }

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { min-height:100%; }
body {
  font-family:var(--ff-body);
  background:var(--c1);
  color:var(--cream);
  overflow-x:hidden;
}
::selection { background:rgba(212,175,55,.35); color:var(--cream); }

/* ── Page: dark carbon with diagonal gold-bronze glow ── */
.ep-auth-page {
  min-height:100vh; min-height:100dvh;
  position:relative;
  display:flex; align-items:center; justify-content:center;
  padding:56px 18px 40px;
  background:
    radial-gradient(ellipse 900px 700px at 50% -10%, rgba(212,175,55,.16), transparent 60%),
    linear-gradient(155deg,var(--c3) 0%,var(--c2) 45%,var(--c0) 100%);
}
/* Ambient gold glow behind the medallion */
.ep-glow {
  position:absolute; top:210px; left:50%;
  width:520px; height:520px; border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,55,.24) 0%,rgba(212,175,55,.08) 45%,transparent 72%);
  filter:blur(10px);
  animation:glow-drift 9s ease-in-out infinite;
  pointer-events:none;
}

/* ── Lang toggle ── */
.ep-lang-btn {
  position:fixed; top:16px; right:16px; z-index:20;
  background:rgba(212,175,55,.1); border:1px solid rgba(212,175,55,.35);
  border-radius:20px; padding:6px 15px;
  font-family:var(--ff-mono); font-size:11px; font-weight:600;
  color:var(--g1); cursor:pointer; transition:all .2s;
  backdrop-filter:blur(6px);
}
.ep-lang-btn:hover { background:rgba(212,175,55,.2); }

/* ════════════════════════════════════════════
   MEDALLION — ornate gold coin behind the card
   ════════════════════════════════════════════ */
.ep-medal-wrap {
  position:relative; z-index:1;
  width:100%; max-width:420px;
  display:flex; flex-direction:column; align-items:center;
}
.ep-medal {
  width:min(78vw,300px); height:min(78vw,300px);
  margin-bottom:-108px;
  position:relative; z-index:1;
  filter:drop-shadow(0 12px 40px rgba(0,0,0,.6));
  animation:medal-pulse 4s ease-in-out infinite;
}

/* ════════════════════
   Card
   ════════════════════ */
.ep-auth-card {
  width:100%; max-width:400px;
  position:relative; z-index:2;
  background:linear-gradient(165deg,var(--c3) 0%,var(--c2) 100%);
  border-radius:22px;
  border:1.5px solid rgba(212,175,55,.35);
  box-shadow:
    0 16px 40px rgba(0,0,0,.5),
    0 4px 14px rgba(0,0,0,.3),
    inset 0 1px 0 rgba(255,255,255,.05);
  overflow:hidden;
  animation:slide-up .55s cubic-bezier(.16,1,.3,1) both;
  padding-top:132px;
}

/* Holographic trim bar across the top */
.ep-auth-holo {
  position:absolute; top:0; left:0; right:0; height:3px; z-index:3;
  background:linear-gradient(90deg,
    var(--g4),var(--g2),var(--g1),var(--g3),var(--g5),var(--g2),var(--g4));
  background-size:300% 100%;
  animation:holo 4s linear infinite;
}
/* Holographic edge strip, echoing the physical ID card */
.ep-auth-card::after {
  content:'';
  position:absolute; top:14px; bottom:14px; right:14px; width:5px;
  border-radius:3px; z-index:1;
  background:linear-gradient(180deg,
    var(--g2),var(--g5),var(--g1),var(--g4),var(--g2),var(--g5),var(--g1));
  background-size:100% 300%;
  animation:holo-v 3.5s linear infinite;
  opacity:.55;
}
@keyframes holo-v { 0%{background-position:0 0}100%{background-position:0 300%} }

.ep-auth-head { padding:0 26px 16px; text-align:center; position:relative; z-index:2; }
.ep-auth-org {
  font-family:var(--ff-am);
  font-size:12px; color:var(--g4); letter-spacing:.3px; margin-bottom:6px;
}
.ep-auth-title {
  font-family:var(--ff-display);
  font-size:24px; font-weight:800;
  color:var(--cream); line-height:1.2;
}
.ep-auth-subtitle {
  font-size:13px; color:var(--tan); margin-top:5px; line-height:1.5;
}

/* Trust row (kept for language toggling: #feat1/2/3) */
.ep-auth-trust {
  display:flex; justify-content:center; gap:14px;
  padding:14px 20px 2px; flex-wrap:wrap;
}
.ep-trust-item {
  display:flex; align-items:center; gap:5px;
  font-size:12px; color:var(--tan-dim);
  font-family:var(--ff-mono); letter-spacing:.2px;
}
.ep-trust-item svg { width:13px; height:13px; flex-shrink:0; color:var(--g3); }

/* Tabs */
.ep-auth-tabs {
  display:flex; margin:16px 26px 0;
  border-bottom:1px solid rgba(212,175,55,.18);
  position:relative; z-index:2;
}
.ep-auth-tab {
  flex:1; padding:12px 8px;
  background:none; border:none;
  font-family:var(--ff-display); font-size:13px; font-weight:800;
  color:var(--tan-dim); cursor:pointer;
  position:relative; transition:color .2s;
  letter-spacing:.3px;
}
.ep-auth-tab::after {
  content:'';
  position:absolute; bottom:-1px; left:15%; right:15%;
  height:2.5px; border-radius:2px;
  background:linear-gradient(90deg,var(--g4),var(--g2));
  transform:scaleX(0); transition:transform .25s cubic-bezier(.22,.68,0,1.2);
}
.ep-auth-tab.active { color:var(--g2); }
.ep-auth-tab.active::after { transform:scaleX(1); }

.ep-auth-body { padding:20px 26px 22px; position:relative; z-index:2; }

/* Notices */
.ep-auth-notice {
  display:flex; align-items:center; gap:10px;
  padding:11px 14px; border-radius:9px;
  font-size:13px; margin-bottom:14px;
  max-height:0; opacity:0; overflow:hidden;
  transition:opacity .25s;
}
.ep-auth-notice.show { opacity:1; max-height:80px; }
.ep-notice-err { background:rgba(239,68,68,.14); border:1px solid rgba(239,68,68,.4); color:#FCA5A5; }
.ep-notice-ok  { background:rgba(34,197,94,.14); border:1px solid rgba(34,197,94,.4); color:#86EFAC; }

/* EtelID hero panel */
.ep-etelid-panel {
  background:linear-gradient(135deg,rgba(212,175,55,.1),rgba(212,175,55,.03));
  border:1.5px solid rgba(212,175,55,.3);
  border-radius:14px; padding:16px; margin-bottom:16px; text-align:center;
}
.ep-etelid-rec {
  font-size:12px; font-weight:700; color:var(--g3);
  letter-spacing:.3px; margin-bottom:10px;
}
.ep-auth-etelid {
  width:100%; padding:13px;
  display:flex; align-items:center; justify-content:center; gap:10px;
  background:linear-gradient(135deg,var(--g8),var(--g6),var(--g4),var(--g3));
  background-size:200% 100%;
  border:1.5px solid rgba(212,175,55,.5); border-radius:11px;
  font-family:var(--ff-display); font-size:14px; font-weight:800;
  color:var(--c0); cursor:pointer; letter-spacing:.3px;
  box-shadow:0 4px 0 var(--g7),0 8px 18px rgba(0,0,0,.4);
  transition:transform .15s,box-shadow .15s; position:relative; overflow:hidden;
}
.ep-auth-etelid::before {
  content:''; position:absolute; top:0; left:-100%; width:50%; height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  animation:shimmer 2.5s infinite; pointer-events:none;
}
.ep-auth-etelid:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 5px 0 var(--g7),0 10px 22px rgba(0,0,0,.45); }
.ep-auth-etelid:active:not(:disabled) { transform:translateY(1px); box-shadow:0 2px 0 var(--g7); }
.ep-auth-etelid:disabled { opacity:.65; cursor:not-allowed; }
.ep-etelid-mark {
  font-family:var(--ff-am); font-size:17px; font-weight:700; color:var(--c0);
}
.ep-etelid-sub { font-size:12px; color:var(--tan-dim); margin-top:8px; }

/* Fields */
.ep-af-field { margin-bottom:18px; }
.ep-af-label {
  font-family:var(--ff-mono) !important;
  font-size:15px !important; font-weight:700;
  color:var(--g3) !important; text-transform:uppercase !important;
  letter-spacing:1px !important; display:block; margin-bottom:8px;
}
.ep-af-wrap { position:relative; display:flex; align-items:center; }
.ep-af-icon {
  position:absolute; left:14px;
  color:var(--g4); pointer-events:none;
  display:flex; align-items:center;
}
.ep-af-icon svg { width:18px; height:18px; }
.ep-af-input {
  width:100%; padding:15px 16px 15px 44px;
  background:rgba(255,255,255,.045);
  border:1.5px solid rgba(212,175,55,.3);
  border-radius:11px;
  font-size:17px; font-weight:600; font-family:var(--ff-body);
  color:var(--cream);
  transition:border-color .2s, box-shadow .2s, background .2s;
  -webkit-appearance:none; appearance:none;
}
.ep-af-input:focus {
  border-color:var(--g3);
  background:rgba(255,255,255,.07);
  box-shadow:0 0 0 3px rgba(212,175,55,.2);
  outline:none;
}
.ep-af-input::placeholder { color:var(--tan-dim); font-weight:500; opacity:.8; }
.ep-af-input:-webkit-autofill,
.ep-af-input:-webkit-autofill:hover,
.ep-af-input:-webkit-autofill:focus {
  -webkit-text-fill-color: var(--cream);
  -webkit-box-shadow: 0 0 0 1000px #1a1206 inset;
  box-shadow: 0 0 0 1000px #1a1206 inset;
  caret-color: var(--cream);
}
.ep-pw-toggle {
  position:absolute; right:8px;
  background:none; border:none;
  color:var(--g4); cursor:pointer;
  padding:8px; border-radius:8px; transition:color .15s, background .15s;
  display:flex; align-items:center;
}
.ep-pw-toggle svg { width:19px; height:19px; }
.ep-pw-toggle:hover { color:var(--g2); background:rgba(212,175,55,.08); }

/* Submit button (Forgot-PIN flow) */
.ep-auth-submit {
  width:100%; padding:14px;
  background:linear-gradient(135deg,
    var(--g8) 0%,var(--g6) 25%,var(--g4) 50%,
    var(--g3) 65%,var(--g2) 78%,var(--g3) 90%,var(--g4) 100%);
  background-size:200% 100%;
  color:var(--c0);
  border:none; border-radius:11px;
  font-family:var(--ff-display);
  font-size:15px; font-weight:800;
  cursor:pointer; letter-spacing:.5px;
  box-shadow:0 5px 0 var(--g7), 0 8px 22px rgba(0,0,0,.4);
  transition:transform .15s, box-shadow .15s;
  position:relative; overflow:hidden;
  margin-top:6px; margin-bottom:14px;
}
.ep-auth-submit::before {
  content:'';
  position:absolute; top:0; left:-100%; width:50%; height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  animation:shimmer 2.5s infinite;
}
.ep-auth-submit:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 0 var(--g7), 0 10px 26px rgba(0,0,0,.45); }
.ep-auth-submit:active:not(:disabled) { transform:translateY(1px); box-shadow:0 3px 0 var(--g7), 0 5px 14px rgba(0,0,0,.35); }
.ep-auth-submit:disabled { opacity:.65; cursor:not-allowed; transform:none; }

/* Ghost button */
.ep-auth-ghost {
  width:100%; padding:14px;
  background:rgba(212,175,55,.05);
  border:1.5px solid rgba(212,175,55,.28);
  border-radius:11px;
  font-family:var(--ff-display); font-size:14px; font-weight:800;
  color:var(--g2); cursor:pointer; letter-spacing:.3px;
  transition:all .2s;
  margin-bottom:8px;
}
.ep-auth-ghost:hover { background:rgba(212,175,55,.1); border-color:rgba(212,175,55,.5); color:var(--g1); }

/* Footer */
.ep-auth-foot {
  padding:12px 26px 20px; text-align:center;
  border-top:1px solid rgba(212,175,55,.14);
  font-family:var(--ff-mono);
  font-size:12px; color:var(--tan-dim); letter-spacing:.5px;
  position:relative; z-index:2;
}

.ep-spin {
  display:inline-block; width:16px; height:16px;
  border:2px solid rgba(0,0,0,.25);
  border-top-color:var(--c0);
  border-radius:50%; animation:spin .7s linear infinite;
  vertical-align:middle; margin-right:6px;
}

@media (max-width:420px) {
  .ep-auth-page { padding:64px 14px 32px; }
  .ep-medal { width:min(70vw,240px); height:min(70vw,240px); margin-bottom:-88px; }
  .ep-auth-card { padding-top:104px; }
  .ep-auth-head { padding:0 20px 14px; }
  .ep-auth-tabs { margin:14px 20px 0; }
  .ep-auth-body { padding:18px 20px 18px; }
}
</style>

<div class="ep-auth-page">
  <div class="ep-glow"></div>
  <button class="ep-lang-btn" id="ep-lang-btn">አማ</button>

  <div class="ep-medal-wrap">

    <!-- ── Ornate gold medallion, drawn — echoes the ETEL Driver coin badge ── -->
    <svg class="ep-medal" viewBox="0 0 300 300" role="img" aria-label="ኢE Pay coin emblem">
      <defs>
        <path id="medalArcTop" d="M 40,150 A 110,110 0 0 1 260,150" fill="none"/>

          <stop offset="100%" stop-color="#0c0805"/>
        </radialGradient>
        <linearGradient id="medalRing" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F2CC6B"/>

      </g>
      <circle cx="150" cy="150" r="140" fill="none" stroke="url(#medalRing)" stroke-width="3" opacity=".9"/>

      <!-- bead dots around the rim -->
      <g fill="#D4AF37">

        <circle cx="269" cy="230" r="3.4" fill="#2f6a35"/><circle cx="245" cy="255" r="3.4"/><circle cx="216" cy="274" r="3.4"/>
        <circle cx="184" cy="286" r="3.4" fill="#7a1f1f"/><circle cx="150" cy="290" r="4"/><circle cx="116" cy="286" r="3.4"/>
        <circle cx="84"  cy="274" r="3.4" fill="#2f6a35"/><circle cx="55"  cy="255" r="3.4"/><circle cx="31"  cy="230" r="3.4"/>
        <circle cx="14"  cy="200" r="3.4" fill="#7a1f1f"/><circle cx="5"   cy="166" r="4"/><circle cx="5"   cy="134" r="3.4"/>

        <circle cx="84"  cy="26"  r="3.4"/><circle cx="116" cy="14"  r="3.4"/>
      </g>

      <!-- coin face -->
      <circle cx="150" cy="150" r="122" fill="url(#medalFace)" stroke="url(#medalRing)" stroke-width="4"/>
      <circle cx="150" cy="150" r="110" fill="none" stroke="#D4AF37" stroke-width="1" opacity=".35"/>
      <circle cx="150" cy="150" r="102" fill="none" stroke="#D4AF37" stroke-width=".6" opacity=".25"/>

      <!-- guilloché fine rings -->

        <circle cx="150" cy="150" r="94"/><circle cx="150" cy="150" r="86"/><circle cx="150" cy="150" r="78"/>

      <!-- arc text -->
      <text font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" letter-spacing="3" fill="#D4AF37">
        <textPath href="#medalArcTop" startOffset="50%" text-anchor="middle">ETEL GROUP · HAWASSA</textPath>
      </text>
      <text font-family="Noto Sans Ethiopic, sans-serif" font-size="11" font-weight="700" fill="#C8960C">
        <textPath href="#medalArcBot" startOffset="50%" text-anchor="middle">ኢትዮጵያ · ኢትኤል ክፍያ</textPath>
      </text>

      <!-- center mark -->
      <text x="150" y="150" font-family="Noto Sans Ethiopic, sans-serif" font-size="58" font-weight="700"
        fill="#F2CC6B" text-anchor="middle" dominant-baseline="central" opacity=".95">ኢE</text>
      <text x="150" y="192" font-family="Syne, sans-serif" font-size="12" font-weight="800" letter-spacing="4"
        fill="#D4AF37" text-anchor="middle">PAY</text>

      <!-- small laurel flourishes -->
      <g stroke="#D4AF37" stroke-width="1.4" fill="none" opacity=".55">
        <path d="M96,192 Q86,206 92,222 M96,192 Q104,204 100,220"/>
        <path d="M204,192 Q214,206 208,222 M204,192 Q196,204 200,220"/>
      </g>
    </svg>

    <div class="ep-auth-card">
      <div class="ep-auth-holo"></div>

      <div class="ep-auth-head">
        <div class="ep-auth-org" id="auth-org">ኢE · Etel Group · Hawassa</div>
        <div class="ep-auth-title" id="auth-title">ኢE Pay</div>
        <div class="ep-auth-subtitle" id="auth-subtitle">Sign in to your digital wallet</div>
      </div>

      <div class="ep-auth-trust">
        <div class="ep-trust-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
          <span id="feat1">Instant transfers across Ethiopia</span>
        </div>
        <div class="ep-trust-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/></svg>
          <span id="feat2">PIN-secured, KYC-verified</span>
        </div>
        <div class="ep-trust-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20"/></svg>
          <span id="feat3">Telebirr &amp; bank top-up</span>
        </div>
      </div>

      <div class="ep-auth-tabs">
        <button class="ep-auth-tab active" id="tab-login" onclick="switchTab('login')">
          <span id="tab-login-txt">Sign In</span>
        </button>
        <button class="ep-auth-tab" id="tab-register" onclick="switchTab('register')">
          <span id="tab-reg-txt">Get EtelID</span>
        </button>
      </div>

      <div class="ep-auth-body">
        <!-- Alert -->
        <div class="ep-auth-notice ep-notice-err" id="l-err"></div>
        <div class="ep-auth-notice ep-notice-ok" id="l-ok"></div>

        <!-- Login form — single path: EtelID authenticates the phone + password below -->
        <div id="form-login">
          <div class="ep-af-field">
            <label class="ep-af-label" id="lbl-phone">Phone Number</label>
            <div class="ep-af-wrap">
              <span class="ep-af-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
              <input class="ep-af-input" id="l-phone" type="tel"
                placeholder="+251 9__ ___ ___"
                autocomplete="tel" inputmode="tel">
            </div>
          </div>
          <div class="ep-af-field">
            <label class="ep-af-label" id="lbl-pin">EtelID Password</label>
            <div class="ep-af-wrap">
              <span class="ep-af-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
              <input class="ep-af-input" id="l-pin" type="password"
                placeholder="••••" maxlength="64"
                autocomplete="current-password">
              <button class="ep-pw-toggle" id="l-eye" tabindex="-1" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="ep-etelid-panel">
            <div class="ep-etelid-rec">✦ One ID for all ETEL services ✦</div>
            <button class="ep-auth-etelid" id="etelid-btn-hero" type="button" onclick="doEtelIdLogin()">
              <span class="ep-etelid-mark">ኢE</span>
              <span id="etelid-btn-txt">Sign in with EtelID</span>
            </button>
            <p class="ep-etelid-sub">Delivery · Ride · Pay — one identity</p>
          </div>

          <button class="ep-auth-ghost" onclick="switchTab('register')" id="create-btn">
            Get EtelID / Create Account →
          </button>
        </div>
      </div>

      <div class="ep-auth-foot">
        ኢE Pay v2.0 · ethelmarket.com · Etel Group · <span id="foot-year">2026</span>
      </div>
    </div>
  </div>
</div>

<div id="ep-toast"></div>
<!-- Kept for applyLang(): brand-desc is no longer shown in this composition but must exist -->
<div id="brand-desc" style="display:none"></div>

<!-- Scripts -->
<script src="js/config.js?v=4.1"></script>
<script src="js/api.js?v=4.1"></script>
<script src="js/core.js?v=4.1"></script>
<script src="js/desktop-shell.js"></script>

<script>
/* ── Surface any real JS error directly in the UI so it's visible
   without opening DevTools (instead of silently doing nothing) ── */
window.addEventListener('error', function(e) {
  try { showErr('Script error: ' + e.message + ' (' + (e.filename||'').split('/').pop() + ':' + e.lineno + ')'); } catch(_) {}
});
window.addEventListener('unhandledrejection', function(e) {
  try { showErr('Unhandled error: ' + ((e.reason && e.reason.message) || String(e.reason))); } catch(_) {}
});

/* ── Tab switching ── */
var _tab = 'login';
function switchTab(t) {
  _tab = t;
  document.getElementById('form-login').style.display   = t==='login'   ? '' : 'none';
  document.getElementById('tab-login').classList.toggle('active',    t==='login');
  document.getElementById('tab-register').classList.toggle('active', t==='register');
  clearNotices();
  if (t === 'register') {
    /* ✦ EtelId Gate: all registration goes through EtelId portal */
    window.open('https://ethelmarket.com/EtelId/', '_blank');
    setTimeout(function(){ document.getElementById('tab-register').classList.remove('active'); _tab='login'; }, 100);
  }
}

/* ── Clear notices ── */
function clearNotices() {
  var e = document.getElementById('l-err');
  var o = document.getElementById('l-ok');
  if(e) { e.classList.remove('show'); e.textContent=''; }
  if(o) { o.classList.remove('show'); o.textContent=''; }
}
function showErr(msg) {
  var el = document.getElementById('l-err');
  el.textContent = msg; el.classList.add('show');
}
function showOk(msg) {
  var el = document.getElementById('l-ok');
  el.textContent = msg; el.classList.add('show');
}

/* ── Bilingual strings ── */
var STRINGS = {
  en: {
    feat1:'Instant transfers across Ethiopia', feat2:'EtelID-secured, KYC-verified', feat3:'Telebirr & bank top-up',
    org:'ኢE · Etel Group · Hawassa', title:'ኢE Pay', subtitle:'Sign in to your digital wallet',
    tabLogin:'Sign In', tabReg:'Create Wallet',
    lblPhone:'Phone Number', lblPin:'EtelID Password',
    btnCreate:'Create Wallet', btnEtelId:'Sign in with EtelID',
    brandDesc:"Ethiopia's trusted digital payment wallet — send, receive and top up instantly."
  },
  am: {
    feat1:'ፈጣን ዝውውር በኢትዮጵያ', feat2:'በEtelID የተጠበቀ፣ KYC የተረጋገጠ', feat3:'ቴሌብር እና ባንክ ቅድሚያ ክፍያ',
    org:'ኢE · ኢትኤል ቡድን · ሃዋሳ', title:'ኢE ክፍያ', subtitle:'ወደ ዲጂታል ቦርሳዎ ይግቡ',
    tabLogin:'ግባ', tabReg:'ቦርሳ ፍጠር',
    lblPhone:'ስልክ ቁጥር', lblPin:'የEtelID የይለፍ ቃል',
    btnCreate:'ቦርሳ ፍጠር', btnEtelId:'በEtelID ግባ',
    brandDesc:'የኢትዮጵያ ዲጂታል ክፍያ ቦርሳ — ቅጽበታዊ ዝውውር፣ ቅድሚያ ክፍያ።'
  }
};

var _lang = 'en';
function applyLang(l) {
  _lang = l;
  var s = STRINGS[l];
  document.getElementById('feat1').textContent     = s.feat1;
  document.getElementById('feat2').textContent     = s.feat2;
  document.getElementById('feat3').textContent     = s.feat3;
  document.getElementById('brand-desc').textContent= s.brandDesc;
  document.getElementById('auth-org').textContent  = s.org;
  document.getElementById('auth-title').textContent= s.title;
  document.getElementById('auth-subtitle').textContent= s.subtitle;
  document.getElementById('tab-login-txt').textContent = s.tabLogin;
  document.getElementById('tab-reg-txt').textContent   = s.tabReg;
  document.getElementById('lbl-phone').textContent = s.lblPhone;
  document.getElementById('lbl-pin').textContent   = s.lblPin;
  document.getElementById('create-btn').textContent= s.btnCreate;
  var etlTxt = document.getElementById('etelid-btn-txt'); if(etlTxt) etlTxt.textContent = s.btnEtelId;
  document.getElementById('ep-lang-btn').textContent = l==='am' ? 'EN' : 'አማ';
  document.getElementById('foot-year').textContent = new Date().getFullYear();
}

/* ── PIN visibility toggle ── */
document.getElementById('l-eye').addEventListener('click', function() {
  var p = document.getElementById('l-pin');
  p.type = p.type === 'password' ? 'text' : 'password';
});

/* ── Normalize phone ── */
function normalizePhone(p) {
  p = p.replace(/\s+/g,'');
  if (/^09/.test(p))   return '+251' + p.slice(1);
  if (/^2519/.test(p)) return '+' + p;
  return p;
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && _tab === 'login') doEtelIdLogin();
});

/* ── Lang toggle ── */
document.getElementById('ep-lang-btn').addEventListener('click', function() {
  applyLang(_lang === 'en' ? 'am' : 'en');
  try { EP_CORE.setLang(_lang); } catch(e) {}
});

/* ── EtelID SSO login ── */
async function doEtelIdLogin() {
  var btn;
  var orig = 'Sign in with EtelID';
  try {
    var s = STRINGS[_lang];
    var phone = document.getElementById('l-phone').value.trim();
    var pin   = document.getElementById('l-pin').value.trim();
    clearNotices();
    if (!phone || !pin) {
      showErr(_lang==='am' ? 'EtelID መለያ እና የይለፍ ቃል ያስገቡ።' : 'Enter your EtelID phone/ID and password.');
      return;
    }
    phone = normalizePhone(phone);
    btn = document.getElementById('etelid-btn-hero') || document.getElementById('etelid-btn');
    var label = document.getElementById('etelid-btn-txt');
    if (label) orig = label.textContent;
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="ep-spin"></span>' + orig; }

    var j = await EP_API.call('ep_login_etelid', { phone: phone, pin: pin });
    if (j && j.success && j.data && j.data.token) {
      EP_CORE.saveToken(j.data.token, phone);
      EP_CORE.nav('wallet');
      return;
    }
    showErr((j && j.data && j.data.message) ||
      (_lang==='am' ? 'EtelID ማረጋገጥ አልተሳካም።' : 'EtelID authentication failed.'));
  } catch(e) {
    showErr('EtelID sign-in error: ' + ((e && e.message) || String(e)));
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '<span class="ep-etelid-mark">ኢE</span><span id="etelid-btn-txt">'+orig+'</span>'; }
  }
}

/* ── Init ── */
EP_CORE.onReady(async function() {
  EP_CORE.registerSW();
  if (EP_CORE.redirectIfLoggedIn('wallet')) return;
  var savedLang = 'en';
  try { savedLang = EP_CORE.getLang() || 'en'; } catch(e) {}
  applyLang(savedLang);
});
</script>
<!-- ETEL AI -- cross-company assistant widget -->
<script src="https://ethelmarket.com/EtelAi/etel-ai-widget.js" data-project="pay"></script>
</body>
